<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartStore | Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f7f8fb}.product{transition:transform .18s,box-shadow .18s}.product:hover{transform:translateY(-3px);box-shadow:0 16px 35px #0f172a12}</style>
</head>
<body class="text-slate-800">
<header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200"><div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between gap-4">
<a href="/customer" class="flex items-center gap-2 font-black text-xl"><span class="w-9 h-9 rounded-xl bg-indigo-600 text-white grid place-items-center">S</span>SmartStore</a>
<div class="hidden sm:block text-sm text-slate-500">Welcome back, <b class="text-slate-800">{{ user.name }}</b></div>
<div class="flex gap-2"><button onclick="showPanel('cart')" class="rounded-xl bg-indigo-50 text-indigo-700 px-4 py-2 font-semibold">Cart <span id="cart-count" class="ml-1 bg-indigo-600 text-white rounded-full px-2 py-0.5 text-xs">0</span></button><button onclick="logout()" class="rounded-xl border px-3 py-2 text-sm">Log out</button></div>
</div></header>
<main class="max-w-7xl mx-auto px-5 py-8">
<section class="rounded-3xl p-7 md:p-10 text-white bg-gradient-to-r from-indigo-700 via-violet-700 to-fuchsia-700 mb-8"><p class="uppercase tracking-[.2em] text-xs text-indigo-100">One marketplace, many great stores</p><h1 class="text-3xl md:text-5xl font-black mt-3 max-w-2xl">Find something you'll love.</h1><p class="mt-3 text-indigo-100 max-w-xl">Explore products from independent vendors, all in one place.</p>
<div class="mt-6 flex flex-col sm:flex-row gap-3"><input id="search" oninput="loadProducts()" placeholder="Search products, stores or categories..." class="rounded-xl px-4 py-3 text-slate-800 w-full sm:max-w-lg outline-none"><select id="category" onchange="loadProducts()" class="rounded-xl px-4 py-3 text-slate-800"><option value="">All categories</option></select></div></section>
<div class="flex items-end justify-between mb-4"><div><p class="text-xs uppercase tracking-widest text-indigo-600 font-bold">Curated marketplace</p><h2 class="text-2xl font-black mt-1">Shop products</h2></div><span id="product-count" class="text-sm text-slate-500"></span></div>
<div id="notice" class="hidden rounded-xl p-3 mb-4 text-sm"></div><div id="products" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
<section id="cart-panel" class="hidden mt-10 bg-white rounded-2xl border p-6"><div class="flex justify-between items-center"><h2 class="text-2xl font-black">Your cart</h2><button onclick="showPanel('none')" class="text-slate-500">Close ✕</button></div><div id="cart-items" class="mt-5 space-y-3"></div><div class="border-t mt-5 pt-5 flex flex-col md:flex-row gap-6 justify-between"><div class="font-bold text-xl">Total: ₹<span id="cart-total">0.00</span></div><div class="flex flex-col sm:flex-row gap-3"><button onclick="showPanel('address')" class="bg-indigo-600 text-white rounded-xl px-5 py-3 font-semibold">Continue to checkout</button></div></div></section>
<section id="address-panel" class="hidden mt-5 bg-white rounded-2xl border p-6"><h2 class="text-xl font-black">Delivery details</h2><div id="saved-addresses" class="mt-4"></div><div class="grid sm:grid-cols-2 gap-3 mt-4"><input id="addr-line" class="border rounded-xl p-3" placeholder="Address line"><input id="addr-city" class="border rounded-xl p-3" placeholder="City"><input id="addr-state" class="border rounded-xl p-3" placeholder="State"><input id="addr-pin" class="border rounded-xl p-3" placeholder="PIN code"></div><button onclick="saveAddress()" class="mt-3 border rounded-xl px-4 py-2">Save new address</button><div class="mt-5 flex flex-col sm:flex-row gap-3"><select id="payment-method" class="border rounded-xl p-3"><option value="COD">Cash on delivery</option><option value="UPI">UPI (demo)</option><option value="Credit Card">Credit card (demo)</option><option value="Debit Card">Debit card (demo)</option><option value="Net Banking">Net banking (demo)</option></select><button onclick="checkout()" class="bg-emerald-600 text-white rounded-xl px-5 py-3 font-bold">Place order</button></div></section>
<section class="mt-10 bg-white rounded-2xl border p-6"><div class="flex items-center justify-between"><h2 class="text-2xl font-black">Your orders</h2><button onclick="loadOrders()" class="text-sm text-indigo-600 font-semibold">Refresh</button></div><div id="orders" class="mt-4 space-y-3"><p class="text-slate-500">Your order history will appear here.</p></div></section>
</main>
<script>
const money=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok||j.status==='error')throw Error(j.message||'Request failed');return j}
function notice(msg, ok = true) {
    const n = document.getElementById('notice');
    n.textContent = msg;
    n.className = 'rounded-xl p-3 mb-4 text-sm ' +
        (ok
            ? 'bg-emerald-50 text-emerald-700'
            : 'bg-rose-50 text-rose-700');
    n.classList.remove('hidden');
    n.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function showPanel(which){['cart','address'].forEach(x=>document.getElementById(x+'-panel').classList.toggle('hidden',which!==x));if(which==='cart')loadCart();if(which==='address')loadAddresses()}
async function loadProducts(){try{const q=new URLSearchParams({search:document.getElementById('search').value,category_id:document.getElementById('category').value});const j=await api('/api/store/products?'+q);const sel=document.getElementById('category');const current=sel.value;if(sel.options.length===1){j.categories.forEach(c=>sel.add(new Option(c.category_name,c.category_id)));sel.value=current}
document.getElementById('product-count').textContent=j.data.length+' products';document.getElementById('products').innerHTML=j.data.map(p=>`<article class="product bg-white border border-slate-200 rounded-2xl overflow-hidden"><div class="h-36 bg-gradient-to-br from-indigo-50 to-violet-100 grid place-items-center"><span class="text-5xl">🛍️</span></div><div class="p-5"><div class="flex justify-between gap-2"><span class="text-xs rounded-full bg-slate-100 px-2 py-1">${esc(p.category_name)}</span><span class="text-xs ${p.stock_quantity>0?'text-emerald-700':'text-rose-600'}">${p.stock_quantity>0?esc(p.stock_quantity)+' in stock':'Out of stock'}</span></div><h3 class="font-bold text-lg mt-3">${esc(p.product_name)}</h3><p class="text-sm text-slate-500 mt-1">Sold by ${esc(p.seller_name)}</p><div class="mt-4 flex items-end justify-between"><div><span class="text-xl font-black">₹${money(p.discounted_price)}</span>${Number(p.discount_percent)>0?`<div class="text-xs text-slate-400 line-through">₹${money(p.price)}</div>`:''}</div><button ${p.stock_quantity<1?'disabled':''} onclick="addCart(${p.product_id})" class="disabled:opacity-40 bg-slate-900 text-white rounded-xl px-3 py-2 text-sm font-semibold">Add to cart</button></div></div></article>`).join('')||'<div class="col-span-full bg-white rounded-2xl p-10 text-center text-slate-500">No products found. Try another search.</div>';}catch(e){notice(e.message,false)}}
async function addCart(id){try{const j=await api('/api/store/cart',{method:'POST',body:JSON.stringify({product_id:id,quantity:1})});notice(j.message);await loadCartCount()}catch(e){notice(e.message,false)}}
async function loadCartCount(){try{const j=await api('/api/store/cart');document.getElementById('cart-count').textContent=j.data.reduce((n,x)=>n+Number(x.quantity),0)}catch{}}
async function loadCart(){try{const j=await api('/api/store/cart');document.getElementById('cart-items').innerHTML=j.data.map(i=>`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border rounded-xl p-4"><div><b>${esc(i.product_name)}</b><p class="text-sm text-slate-500">${esc(i.seller_name)} · ₹${money(i.unit_price)} each</p></div><div class="flex items-center gap-2"><input type="number" min="1" max="${i.stock_quantity}" value="${i.quantity}" id="qty-${i.cart_item_id}" class="w-16 border rounded-lg p-2"><button onclick="updateQty(${i.cart_item_id})" class="text-indigo-600 text-sm">Update</button><button onclick="removeItem(${i.cart_item_id})" class="text-rose-600 text-sm">Remove</button><b>₹${money(i.unit_price*i.quantity)}</b></div></div>`).join('')||'<p class="text-slate-500">Your cart is empty.</p>';document.getElementById('cart-total').textContent=money(j.total);document.getElementById('cart-count').textContent=j.data.reduce((n,x)=>n+Number(x.quantity),0)}catch(e){notice(e.message,false)}}
async function updateQty(id){try{await api('/api/store/cart/'+id,{method:'PUT',body:JSON.stringify({quantity:Number(document.getElementById('qty-'+id).value)})});loadCart()}catch(e){notice(e.message,false)}}
async function removeItem(id){try{await api('/api/store/cart/'+id,{method:'DELETE'});loadCart();loadCartCount()}catch(e){notice(e.message,false)}}
async function loadAddresses(){try{const j=await api('/api/store/addresses');document.getElementById('saved-addresses').innerHTML=j.data.map(a=>`<label class="flex gap-3 border rounded-xl p-3 mb-2"><input type="radio" name="address" value="${a.address_id}" ${a.is_default?'checked':''}><span>${esc(a.address_line)}, ${esc(a.city)}, ${esc(a.state)} - ${esc(a.pincode)} ${a.is_default?'<b class="text-xs text-indigo-600">DEFAULT</b>':''}</span></label>`).join('')||'<p class="text-sm text-slate-500">Add a delivery address below to continue.</p>'}catch(e){notice(e.message,false)}}
async function saveAddress(){try{const body={address_line:document.getElementById('addr-line').value,city:document.getElementById('addr-city').value,state:document.getElementById('addr-state').value,pincode:document.getElementById('addr-pin').value};await api('/api/store/addresses',{method:'POST',body:JSON.stringify(body)});['addr-line','addr-city','addr-state','addr-pin'].forEach(id=>document.getElementById(id).value='');notice('Address saved.');loadAddresses()}catch(e){notice(e.message,false)}}
async function checkout(){const address=document.querySelector('input[name="address"]:checked');if(!address){notice('Select or save a delivery address first.',false);return}try{const j=await api('/api/store/checkout',{method:'POST',body:JSON.stringify({address_id:Number(address.value),payment_method:document.getElementById('payment-method').value})});notice('Order #'+j.order_id+' placed successfully!');showPanel('none');await loadCartCount();await loadOrders()}catch(e){notice(e.message,false)}}
async function loadOrders(){try{const j=await api('/api/store/orders');document.getElementById('orders').innerHTML=j.data.map(o=>`<div class="border rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3"><div><b>Order #${o.order_id}</b><p class="text-sm text-slate-500">${esc(o.order_date)} · ${esc(o.items||'Order items')} · ${o.item_count} item(s)</p></div><div class="md:text-right"><b>₹${money(o.total_amount)}</b><p class="text-sm mt-1"><span class="rounded-full bg-indigo-50 text-indigo-700 px-3 py-1">${esc(o.order_status)}</span> <span class="text-slate-500">${esc(o.payment_method||'')} · ${esc(o.payment_status||'')}</span></p></div></div>`).join('')||'<p class="text-slate-500">No orders yet. Your first purchase will appear here.</p>'}catch(e){notice(e.message,false)}}
async function logout(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/login'}}
loadProducts();loadCartCount();loadOrders();
</script></body></html>
