<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartStore | Vendor Studio</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-800"><header class="bg-white border-b sticky top-0 z-10"><div class="max-w-7xl mx-auto px-5 h-16 flex justify-between items-center"><a href="/vendor" class="font-black text-xl flex items-center gap-2"><span class="w-9 h-9 bg-indigo-600 text-white rounded-xl grid place-items-center">S</span>Vendor Studio</a><div class="flex items-center gap-3"><span class="hidden sm:block text-sm text-slate-500">Welcome, <b class="text-slate-800">{{ user.name }}</b></span><button onclick="logout()" class="border rounded-xl px-3 py-2 text-sm">Log out</button></div></div></header>
<main class="max-w-7xl mx-auto px-5 py-8"><section class="rounded-3xl p-8 bg-gradient-to-r from-slate-900 to-indigo-900 text-white"><p class="text-xs uppercase tracking-[.2em] text-indigo-200">Vendor workspace</p><h1 class="text-3xl md:text-4xl font-black mt-2">Manage your store.</h1><p class="mt-2 text-slate-300">Your products, inventory and fulfilment — all in one place.</p></section>
<div id="notice" class="hidden rounded-xl p-3 mt-5 text-sm"></div><section id="stats" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6"></section>
<div class="grid lg:grid-cols-3 gap-6 mt-7"><section class="lg:col-span-2 bg-white rounded-2xl border p-5"><div class="flex justify-between items-center"><h2 class="text-xl font-black">Your products</h2><button onclick="loadProducts()" class="text-sm text-indigo-600">Refresh</button></div><div class="overflow-x-auto mt-4"><table class="w-full text-sm text-left"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-3">Product</th><th class="p-3">Price</th><th class="p-3">Stock</th><th class="p-3">Edit</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="bg-white rounded-2xl border p-5"><h2 class="text-xl font-black">List a product</h2><div class="space-y-3 mt-4"><input id="p-name" class="border rounded-xl p-3 w-full" placeholder="Product name"><select id="p-category" class="border rounded-xl p-3 w-full"><option value="">Choose category</option></select><div class="grid grid-cols-2 gap-3"><input id="p-price" type="number" min="0.01" step=".01" class="border rounded-xl p-3 w-full" placeholder="Price ₹"><input id="p-stock" type="number" min="0" class="border rounded-xl p-3 w-full" placeholder="Stock"></div><input id="p-discount" type="number" min="0" max="100" class="border rounded-xl p-3 w-full" placeholder="Discount % (optional)"><button onclick="addProduct()" class="w-full bg-indigo-600 text-white rounded-xl p-3 font-bold">Add product</button></div></section></div>
<section class="bg-white rounded-2xl border p-5 mt-7"><div class="flex justify-between items-center"><h2 class="text-xl font-black">Orders for your products</h2><button onclick="loadOrders()" class="text-sm text-indigo-600">Refresh</button></div><div class="overflow-x-auto mt-4"><table class="w-full text-sm text-left"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-3">Order</th><th class="p-3">Product</th><th class="p-3">Customer</th><th class="p-3">Qty</th><th class="p-3">Amount</th><th class="p-3">Status</th></tr></thead><tbody id="orders"></tbody></table></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const j=await r.json();if(!r.ok||j.status==='error')throw Error(j.message||'Request failed');return j}
function note(s,ok=true){const n=document.getElementById('notice');n.textContent=s;n.className='rounded-xl p-3 mt-5 text-sm '+(ok?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700')}
async function loadSummary(){try{const j=await api('/api/vendor/summary'),d=j.data;document.getElementById('stats').innerHTML=[['Products',d.products,'📦'],['Low stock',d.low_stock,'⚠️'],['Pending items',d.pending_items,'🧾'],['Gross sales','₹'+money(d.gross_sales),'↗']].map(x=>`<div class="bg-white border rounded-2xl p-5"><div class="text-2xl">${x[2]}</div><p class="text-sm text-slate-500 mt-3">${x[0]}</p><p class="text-2xl font-black mt-1">${x[1]}</p></div>`).join('')}catch(e){note(e.message,false)}}
async function loadCategories(){try{const j=await api('/api/vendor/categories');j.data.forEach(c=>document.getElementById('p-category').add(new Option(c.category_name,c.category_id)))}catch(e){note(e.message,false)}}
async function loadProducts(){try{const j=await api('/api/vendor/products');document.getElementById('products').innerHTML=j.data.map(p=>`<tr class="border-t"><td class="p-3"><b>${esc(p.product_name)}</b><div class="text-xs text-slate-500">${esc(p.category_name)} · ${p.is_active?'Listed':'Unlisted'}</div></td><td class="p-3">₹${money(p.discounted_price)}</td><td class="p-3">${p.stock_quantity}</td><td class="p-3"><button onclick="editProduct(${p.product_id},'${esc(p.product_name).replace(/'/g,'&#39;')}',${p.price},${p.stock_quantity},${p.discount_percent})" class="text-indigo-600 font-semibold">Edit</button></td></tr>`).join('')||'<tr><td colspan="4" class="p-5 text-slate-500">No products listed yet.</td></tr>'}catch(e){note(e.message,false)}}
async function addProduct(){try{const body={product_name:document.getElementById('p-name').value,category_id:Number(document.getElementById('p-category').value),price:Number(document.getElementById('p-price').value),stock_quantity:Number(document.getElementById('p-stock').value),discount_percent:Number(document.getElementById('p-discount').value||0)};const j=await api('/api/vendor/products',{method:'POST',body:JSON.stringify(body)});note(j.message);['p-name','p-price','p-stock','p-discount'].forEach(id=>document.getElementById(id).value='');loadProducts();loadSummary()}catch(e){note(e.message,false)}}
async function editProduct(id,name,price,stock,discount){const n=prompt('Product name:',name);if(n===null)return;const p=prompt('Price:',price);if(p===null)return;const q=prompt('Stock quantity:',stock);if(q===null)return;const d=prompt('Discount percent:',discount);if(d===null)return;try{const j=await api('/api/vendor/products/'+id,{method:'PUT',body:JSON.stringify({product_name:n,price:Number(p),stock_quantity:Number(q),discount_percent:Number(d)})});note(j.message);loadProducts();loadSummary()}catch(e){note(e.message,false)}}
async function loadOrders(){try{const j=await api('/api/vendor/orders');document.getElementById('orders').innerHTML=j.data.map(o=>`<tr class="border-t"><td class="p-3 font-bold">#${o.order_id}</td><td class="p-3">${esc(o.product_name)}</td><td class="p-3">${esc(o.customer_name)}<div class="text-xs text-slate-500">${esc(o.city||'')}</div></td><td class="p-3">${o.quantity}</td><td class="p-3">₹${money(o.unit_price*o.quantity)}</td><td class="p-3"><select onchange="setStatus(${o.order_item_id},this.value)" class="border rounded-lg p-2"><option ${o.item_status==='Pending'?'selected':''}>Pending</option><option ${o.item_status==='Shipped'?'selected':''}>Shipped</option><option ${o.item_status==='Delivered'?'selected':''}>Delivered</option><option ${o.item_status==='Cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="6" class="p-5 text-slate-500">No order items for your store yet.</td></tr>'}catch(e){note(e.message,false)}}
async function setStatus(id,status){try{const j=await api('/api/vendor/orders/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});note(j.message);loadOrders();loadSummary()}catch(e){note(e.message,false);loadOrders()}}
async function logout(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/vendor/login'}}
loadSummary();loadCategories();loadProducts();loadOrders();
</script></body></html>
